<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운동회 앱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>" />
  <script>
    // css는 js와 달리 캐시 버스팅이 안 걸려 있어서 브라우저/CDN에 옛날 스타일이
    // 계속 캐시되는 문제가 있었음. js와 똑같이 매번 새 쿼리스트링을 붙여서 로드.
    document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');
  </script>
</head>
<body>
  <div id="app"></div>
  <button id="hard-refresh-btn" type="button" title="캐시 무시하고 새로고침" aria-label="새로고침">🔄</button>

  <!-- Firebase SDK (compat) — 버전 고정 -->
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

  <script>
    if (typeof firebase === "undefined" || !firebase.firestore) {
      document.getElementById("app").innerHTML =
        '<section class="card"><h1>⚠️ Firebase 로드 실패</h1>' +
        '<p class="sub">www.gstatic.com 접속이 막혀있을 수 있어요 (방화벽 / 보안 프로그램 / 회사·학교 네트워크 / 확장 프로그램). ' +
        '다른 네트워크나 브라우저, 시크릿 창에서 시도해보세요.</p>' +
        '<button class="wide-btn" onclick="location.reload()">새로고침</button></section>';
    } else {
      // 캐시된 옛날 js가 계속 뜨는 걸 막기 위해 매번 새 쿼리스트링을 붙여 로드.
      // (그래서 아래 🔄 버튼 = 사실상 Ctrl+Shift+R)
      var __v = Date.now();
      document.write(
        '<script src="js/vendor/jsQR.min.js?v=' + __v + '"><\/script>' +
        '<script src="js/config.js?v=' + __v + '"><\/script>' +
        '<script src="js/supplies.js?v=' + __v + '"><\/script>' +
        '<script src="js/api.js?v=' + __v + '"><\/script>' +
        '<script src="js/app.js?v=' + __v + '"><\/script>'
      );
    }
  </script>
  <script>
    document.getElementById("hard-refresh-btn").addEventListener("click", function () {
      location.reload();
    });
  </script>
</body>
</html>
