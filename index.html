<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운동회 앱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <button id="hard-refresh-btn" type="button" title="캐시 무시하고 새로고침" aria-label="새로고침">🔄</button>

  <!-- Firebase SDK (compat) — 버전 고정 -->
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

  <script>
    // 캐시된 옛날 js 파일이 계속 뜨는 문제를 막기 위해, 매번 새 쿼리스트링을 붙여서
    // 우리 스크립트를 불러옵니다 — 브라우저가 매번 "새로운 URL"로 인식해서 캐시를 안 씁니다.
    // (그래서 아래 새로고침 버튼을 누르면 사실상 Ctrl+Shift+R과 같은 효과가 납니다)
    var __v = Date.now();
    document.write(
      '<script src="js/vendor/jsQR.min.js?v=' + __v + '"><\/script>' +
      '<script src="js/config.js?v=' + __v + '"><\/script>' +
      '<script src="js/api.js?v=' + __v + '"><\/script>' +
      '<script src="js/app.js?v=' + __v + '"><\/script>'
    );
  </script>
  <script>
    document.getElementById("hard-refresh-btn").addEventListener("click", function () {
      location.reload();
    });
  </script>
</body>
</html>
